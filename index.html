<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, minimal-ui">
<title>心迹日记 · 图片流畅版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body,html{width:100%;height:100%;background:#ffffff;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#000000;background:#ffffff;overflow-x:hidden;}
.app{max-width:720px;margin:0 auto;padding:20px 20px 40px;min-height:100%;background:#ffffff;display:flex;flex-direction:column;}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.head h1{font-size:1.7rem;font-weight:460;letter-spacing:-0.3px;color:#000000;line-height:1.2;}
.head span{font-size:0.7rem;color:#5e5e5e;background:#f2f2f2;padding:4px 12px;border-radius:14px;font-weight:400;}
.new-note-btn{width:100%;background:#ffffff;border:1px solid #d4d4d4;border-radius:16px;padding:12px 0;margin-bottom:20px;font-size:0.9rem;color:#2c2c2c;cursor:pointer;transition:0.08s;font-weight:450;text-align:center;}
.new-note-btn:active{background:#f5f5f5;border-color:#aaa;}
.title-wrapper{margin-bottom:8px;}
.title-input{width:100%;border:1px solid #e2e2e2;border-radius:16px;padding:10px 16px;font-size:1rem;font-weight:500;font-family:inherit;outline:none;background:#fff;color:#000;}
.title-input:focus{border-color:#aaa;}
.title-input::placeholder{color:#b0b0b0;font-weight:400;}
.diary-card{border:1px solid #e2e2e2;border-radius:16px;background:#ffffff;margin-bottom:12px;overflow:hidden;}
.content-editable{width:100%;min-height:260px;padding:16px 18px;font-size:0.95rem;line-height:1.48;font-family:inherit;outline:none;background:#fff;color:#1e1e1e;overflow-y:auto;}
.content-editable:empty:before{content:attr(placeholder);color:#bcbcbc;}
.content-editable img{max-width:100%;max-height:120px;border-radius:12px;margin:6px 0;display:block;object-fit:cover;cursor:pointer;}
.button-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:20px;flex-wrap:nowrap;}
.action-btn{background:#000;border:none;border-radius:40px;color:#fff;padding:6px 14px;font-size:0.75rem;font-weight:450;cursor:pointer;transition:0.08s;letter-spacing:0.2px;white-space:nowrap;}
.action-btn:active{background:#2c2c2c;}
.history-wrap{margin-top:0;padding-top:0;}
.history-label{font-size:0.7rem;font-weight:480;margin-bottom:14px;color:#3a3a3a;letter-spacing:0.3px;}
.history-list{display:flex;flex-direction:column;gap:10px;}
.history-item{display:flex;justify-content:space-between;align-items:center;border:1px solid #e2e2e2;border-radius:14px;padding:10px 16px;background:#ffffff;cursor:pointer;transition:0.05s linear;}
.history-item:active{background:#f8f8f8;}
.item-info{overflow:hidden;flex:1;}
.item-date{font-size:0.65rem;color:#6b6b6b;margin-bottom:4px;letter-spacing:-0.2px;}
.item-preview{font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1a1a1a;font-weight:430;}
.empty-history{text-align:center;padding:34px 20px;color:#a0a0a0;font-size:0.8rem;border:1px solid #ececec;border-radius:20px;background:#fefefe;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1c1c1c;color:#ffffff;padding:8px 24px;border-radius:40px;font-size:0.7rem;z-index:1000;opacity:0;transition:opacity 0.12s;pointer-events:none;font-weight:400;}
</style>
</head>
<body>
<div class="app">
<div class="head">
<h1>心迹日记</h1>
<span id="totalCount">0篇</span>
</div>
<button id="newNoteBtn" class="new-note-btn">+ 新建笔记</button>
<div class="title-wrapper">
<input type="text" id="noteTitle" class="title-input" placeholder="标题" autocomplete="off">
</div>
<div class="diary-card">
<div id="noteBody" class="content-editable" contenteditable="true" placeholder="写下第一篇日记。"></div>
</div>
<div class="button-row">
<button id="insertImageBtn" class="action-btn">图片</button>
<button id="exportBtn" class="action-btn">导出</button>
<button id="importBtn" class="action-btn">导入</button>
<button id="saveNote" class="action-btn">保存</button>
</div>
<div class="history-wrap">
<div class="history-label">── 最近记录 ──</div>
<div id="recentList" class="history-list"></div>
</div>
</div>
<div id="globalToast" class="toast">已保存</div>

<script>
(function(){
const STORAGE_KEY="mono_diary_v21";
const IMAGE_STORE_KEY="mono_diary_images";
let notes=[];
let activeId=null;
let lastBlobUrl=null;
let imageStore=new Map(); // id -> base64 (仅用于导出/导入，运行时不用)

function getTodayStr(){
let d=new Date();
let y=d.getFullYear();
let m=String(d.getMonth()+1).padStart(2,'0');
let day=String(d.getDate()).padStart(2,'0');
return `${y}-${m}-${day}`;
}

function genId(){
return Date.now()+'-'+Math.random().toString(36).substring(2,8);
}

function saveToLocal(){
let notesForStorage=notes.map(note=>{
let content=note.content;
let imgIds=[];
let tempDiv=document.createElement('div');
tempDiv.innerHTML=content;
tempDiv.querySelectorAll('img').forEach(img=>{
if(img.getAttribute('data-img-id')){
imgIds.push(img.getAttribute('data-img-id'));
}
});
return {
...note,
content:content,
imageIds:imgIds
};
});
localStorage.setItem(STORAGE_KEY,JSON.stringify(notesForStorage));
renderAll();
}

function getBodyHTML(){
return document.getElementById('noteBody').innerHTML;
}

function setBodyHTML(html){
document.getElementById('noteBody').innerHTML=html||'';
attachImageDoubleClick();
}

function attachImageDoubleClick(){
let images=document.querySelectorAll('#noteBody img');
images.forEach(img=>{
img.removeEventListener('dblclick',img._doubleClickHandler);
img.removeEventListener('touchend',img._touchEndHandler);
let clickTimer=null;
let doubleClickHandler=()=>{
if(confirm('删除这张图片？')){
let imgId=img.getAttribute('data-img-id');
if(imgId){
imageStore.delete(imgId);
}
img.remove();
showToast('图片已删除');
}
};
let touchEndHandler=(e)=>{
if(clickTimer){
clearTimeout(clickTimer);
clickTimer=null;
doubleClickHandler();
e.preventDefault();
}else{
clickTimer=setTimeout(()=>{clickTimer=null;},200);
}
};
img._doubleClickHandler=doubleClickHandler;
img._touchEndHandler=touchEndHandler;
img.addEventListener('dblclick',doubleClickHandler);
img.addEventListener('touchend',touchEndHandler);
});
}

function updateCount(){
document.getElementById('totalCount').innerText=notes.length+'篇';
}

function loadCurrentNote(){
let targetNote=activeId?notes.find(n=>n.id===activeId):null;
if(targetNote){
document.getElementById('noteTitle').value=targetNote.title||'';
setBodyHTML(targetNote.content||'');
}else if(notes.length>0){
activeId=notes[0].id;
let first=notes[0];
document.getElementById('noteTitle').value=first.title||'';
setBodyHTML(first.content||'');
}else{
activeId=null;
document.getElementById('noteTitle').value='';
setBodyHTML('');
}
}

function addNewNote(){
let newId=genId();
let newNote={
id:newId,
title:'新笔记',
content:'',
updatedAt:Date.now(),
dateStr:getTodayStr()
};
notes.unshift(newNote);
activeId=newId;
saveToLocal();
showToast('新建笔记');
}

function deleteNoteById(id){
if(!id)return;
if(confirm('删除这篇日记？')){
let idx=notes.findIndex(n=>n.id===id);
if(idx!==-1){
let note=notes[idx];
let tempDiv=document.createElement('div');
tempDiv.innerHTML=note.content;
tempDiv.querySelectorAll('img').forEach(img=>{
let imgId=img.getAttribute('data-img-id');
if(imgId) imageStore.delete(imgId);
});
notes.splice(idx,1);
if(notes.length===0){
activeId=null;
} else if(activeId===id){
activeId=notes[0].id;
}
saveToLocal();
showToast('已删除');
}
}
}

function saveCurrent(){
if(!activeId && notes.length===0){
let newId=genId();
let newNote={
id:newId,
title:document.getElementById('noteTitle').value.trim()||'启程',
content:getBodyHTML(),
updatedAt:Date.now(),
dateStr:getTodayStr()
};
notes=[newNote];
activeId=newId;
saveToLocal();
showToast('已保存');
return;
}
if(!activeId && notes.length>0){activeId=notes[0].id;}
let titleVal=document.getElementById('noteTitle').value;
let contentVal=getBodyHTML();
let idx=notes.findIndex(n=>n.id===activeId);
if(idx!==-1){
notes[idx].title=titleVal===''?'启程':titleVal;
notes[idx].content=contentVal;
notes[idx].updatedAt=Date.now();
notes[idx].dateStr=getTodayStr();
saveToLocal();
showToast('已保存');
}else if(notes.length){
activeId=notes[0].id;
saveCurrent();
}else{
addNewNote();
saveCurrent();
}
}

function insertImage(){
let input=document.createElement('input');
input.type='file';
input.accept='image/*';
input.multiple=true;
input.onchange=(e)=>{
let files=Array.from(e.target.files);
for(let file of files){
let reader=new FileReader();
reader.onload=(ev)=>{
let imgId=genId();
let base64=ev.target.result;
imageStore.set(imgId,base64);
let img=document.createElement('img');
img.src=base64;
img.setAttribute('data-img-id',imgId);
img.style.maxWidth='100%';
img.style.maxHeight='120px';
img.style.borderRadius='12px';
img.style.margin='6px 0';
img.style.display='block';
document.getElementById('noteBody').appendChild(img);
attachImageDoubleClick();
showToast('已添加图片');
};
reader.readAsDataURL(file);
}
};
input.click();
}

function exportData(){
if(lastBlobUrl){
URL.revokeObjectURL(lastBlobUrl);
lastBlobUrl=null;
}
let exportData={
version:1,
notes:notes,
images:Array.from(imageStore.entries())
};
let dataStr=JSON.stringify(exportData,null,2);
let blob=new Blob([dataStr],{type:'application/json'});
let url=URL.createObjectURL(blob);
lastBlobUrl=url;
let a=document.createElement('a');
a.href=url;
a.download=`心迹日记_备份_${getTodayStr()}.json`;
document.body.appendChild(a);
a.click();
setTimeout(()=>{
document.body.removeChild(a);
if(lastBlobUrl){
URL.revokeObjectURL(lastBlobUrl);
lastBlobUrl=null;
}
},500);
showToast('导出成功');
}

function importData(){
let input=document.createElement('input');
input.type='file';
input.accept='application/json';
input.onchange=(e)=>{
let file=e.target.files[0];
if(!file)return;
let reader=new FileReader();
reader.onload=(ev)=>{
try{
let imported=JSON.parse(ev.target.result);
if(imported.version===1 && Array.isArray(imported.notes)){
notes=imported.notes;
imageStore.clear();
if(imported.images){
imported.images.forEach(([id,base64])=>{
imageStore.set(id,base64);
});
}
if(notes.length>0){
activeId=notes[0].id;
}else{
activeId=null;
}
saveToLocal();
showToast('导入成功');
}else{
showToast('文件格式错误');
}
}catch(err){
showToast('解析失败');
}
};
reader.readAsText(file);
};
input.click();
}

function renderRecent(){
let container=document.getElementById('recentList');
if(!container)return;
if(notes.length===0){
container.innerHTML='<div class="empty-history">暂无日记 · 点击上方新建</div>';
return;
}
let sorted=[...notes];
sorted.sort((a,b)=>b.updatedAt-a.updatedAt);
let limit=Math.min(12,sorted.length);
let itemsHtml='';
for(let i=0;i<limit;i++){
let note=sorted[i];
let dateShow=note.dateStr||'最近';
let titleRaw=note.title?note.title:'无标题';
let previewRaw=(note.content||'').replace(/<[^>]*>/g,' ').replace(/\n/g,' ').substring(0,38);
if(previewRaw==='')previewRaw='无内容';
itemsHtml+=`
<div class="history-item" data-id="${note.id}">
<div class="item-info">
<div class="item-date">${escapeHtml(dateShow)}</div>
<div class="item-preview">${escapeHtml(titleRaw)} · ${escapeHtml(previewRaw)}</div>
</div>
</div>`;
}
container.innerHTML=itemsHtml;
}

function renderAll(){
updateCount();
renderRecent();
loadCurrentNote();
}

function showToast(msg){
let toast=document.getElementById('globalToast');
if(!toast)return;
toast.innerText=msg;
toast.style.opacity='1';
if(window.timerToast)clearTimeout(window.timerToast);
window.timerToast=setTimeout(()=>{toast.style.opacity='0';},1300);
}

function escapeHtml(str){
if(!str)return '';
return str.replace(/[&<>]/g,function(m){if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';return m;});
}

function loadInitial(){
let raw=localStorage.getItem(STORAGE_KEY);
if(raw){
try{
let arr=JSON.parse(raw);
if(Array.isArray(arr)){
notes=arr;
}else{
notes=[];
}
}catch(e){notes=[];}
}
if(notes.length===0){
let initId=genId();
notes=[{
id:initId,
title:'启程',
content:'写下第一篇日记。',
updatedAt:Date.now(),
dateStr:getTodayStr()
}];
activeId=initId;
}else{
activeId=notes[0].id;
}
renderAll();
}

function setupEventDelegation(){
let container=document.getElementById('recentList');
if(!container)return;
container.addEventListener('click',(e)=>{
let target=e.target.closest('.history-item');
if(!target)return;
let id=target.getAttribute('data-id');
if(id && !window._longPressActive){
activeId=id;
renderAll();
showToast('切换');
}
});
let pressTimer=null;
container.addEventListener('touchstart',(e)=>{
let target=e.target.closest('.history-item');
if(!target)return;
let id=target.getAttribute('data-id');
pressTimer=setTimeout(()=>{
if(id){
window._longPressActive=true;
deleteNoteById(id);
setTimeout(()=>{window._longPressActive=false;},100);
}
pressTimer=null;
},500);
});
container.addEventListener('touchend',()=>{
if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
});
container.addEventListener('touchmove',()=>{
if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
});
container.addEventListener('mousedown',(e)=>{
let target=e.target.closest('.history-item');
if(!target)return;
let id=target.getAttribute('data-id');
pressTimer=setTimeout(()=>{
if(id){
window._longPressActive=true;
deleteNoteById(id);
setTimeout(()=>{window._longPressActive=false;},100);
}
pressTimer=null;
},500);
});
container.addEventListener('mouseup',()=>{
if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
});
container.addEventListener('mouseleave',()=>{
if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
});
}

function bindEvents(){
let saveButton=document.getElementById('saveNote');
if(saveButton)saveButton.addEventListener('click',()=>saveCurrent());
let newBtn=document.getElementById('newNoteBtn');
if(newBtn)newBtn.addEventListener('click',()=>addNewNote());
let imgBtn=document.getElementById('insertImageBtn');
if(imgBtn)imgBtn.addEventListener('click',()=>insertImage());
let exportBtn=document.getElementById('exportBtn');
if(exportBtn)exportBtn.addEventListener('click',()=>exportData());
let importBtn=document.getElementById('importBtn');
if(importBtn)importBtn.addEventListener('click',()=>importData());
window.addEventListener('keydown',(e)=>{
if((e.ctrlKey||e.metaKey)&&e.key==='s'){
e.preventDefault();
saveCurrent();
}
});
setupEventDelegation();
}

loadInitial();
bindEvents();
})();
</script>
</body>
</html>
