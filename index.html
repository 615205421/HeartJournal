<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, minimal-ui">
<title>心迹日记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body,html{width:100%;height:100%;background:#ffffff;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#000000;background:#ffffff;overflow-x:hidden;}
.app{max-width:720px;margin:0 auto;padding:20px 20px 40px;min-height:100%;background:#ffffff;display:flex;flex-direction:column;}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.head h1{font-size:1.7rem;font-weight:460;letter-spacing:-0.3px;color:#000000;line-height:1.2;}
.head span{font-size:0.7rem;color:#5e5e5e;background:#f2f2f2;padding:4px 12px;border-radius:14px;font-weight:400;}
.new-note-btn{width:100%;background:#ffffff;border:1px solid #d4d4d4;border-radius:16px;padding:12px 0;margin-bottom:20px;font-size:0.9rem;color:#2c2c2c;cursor:pointer;transition:0.08s;font-weight:450;text-align:center;}
.new-note-btn:active{background:#f5f5f5;border-color:#aaa;}
.title-wrapper{margin-bottom:8px;}
.title-input{width:100%;border:1px solid #e2e2e2;border-radius:16px;padding:10px 16px;font-size:1rem;font-weight:500;font-family:inherit;outline:none;background:#fff;color:#000;}
.title-input:focus{border-color:#aaa;}
.title-input::placeholder{color:#b0b0b0;font-weight:400;}
.diary-card{border:1px solid #e2e2e2;border-radius:16px;background:#ffffff;margin-bottom:12px;overflow:hidden;}
.content-editable{width:100%;min-height:260px;padding:16px 18px;font-size:0.95rem;line-height:1.48;font-family:inherit;outline:none;background:#fff;color:#1e1e1e;overflow-y:auto;}
.content-editable:empty:before{content:attr(placeholder);color:#bcbcbc;}
.content-editable img{max-width:100%;max-height:120px;border-radius:12px;margin:6px 0;display:block;object-fit:cover;cursor:pointer;}
.button-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:20px;flex-wrap:nowrap;}
.action-btn{background:#000;border:none;border-radius:40px;color:#fff;padding:6px 14px;font-size:0.75rem;font-weight:450;cursor:pointer;transition:0.08s;letter-spacing:0.2px;white-space:nowrap;}
.action-btn:active{background:#2c2c2c;}
.history-wrap{margin-top:0;padding-top:0;}
.history-label{font-size:0.7rem;font-weight:480;margin-bottom:14px;color:#3a3a3a;letter-spacing:0.3px;}
.history-list{display:flex;flex-direction:column;gap:10px;}
.history-item{display:flex;justify-content:space-between;align-items:center;border:1px solid #e2e2e2;border-radius:14px;padding:10px 16px;background:#ffffff;cursor:pointer;transition:0.05s linear;}
.history-item:active{background:#f8f8f8;}
.item-info{overflow:hidden;flex:1;}
.item-date{font-size:0.65rem;color:#6b6b6b;margin-bottom:4px;letter-spacing:-0.2px;}
.item-preview{font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1a1a1a;font-weight:430;}
.empty-history{text-align:center;padding:34px 20px;color:#a0a0a0;font-size:0.8rem;border:1px solid #ececec;border-radius:20px;background:#fefefe;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1c1c1c;color:#ffffff;padding:8px 24px;border-radius:40px;font-size:0.7rem;z-index:1000;opacity:0;transition:opacity 0.12s;pointer-events:none;font-weight:400;}
</style>
</head>
<body>
<div class="app">
<div class="head">
<h1>心迹日记</h1>
<span id="totalCount">0篇</span>
</div>
<button id="newNoteBtn" class="new-note-btn">+ 新建笔记</button>
<div class="title-wrapper">
<input type="text" id="noteTitle" class="title-input" placeholder="标题" autocomplete="off">
</div>
<div class="diary-card">
<div id="noteBody" class="content-editable" contenteditable="true" placeholder="写下第一篇日记。"></div>
</div>
<div class="button-row">
<button id="insertImageBtn" class="action-btn">图片</button>
<button id="exportBtn" class="action-btn">导出</button>
<button id="importBtn" class="action-btn">导入</button>
<button id="saveNote" class="action-btn">保存</button>
</div>
<div class="history-wrap">
<div class="history-label">── 最近记录 ──</div>
<div id="recentList" class="history-list"></div>
</div>
</div>
<div id="globalToast" class="toast">已保存</div>

<script>
(function(){
// ---------- File System Access API 图片存储 ----------
let rootHandle = null;        // 用户选的文件夹句柄
const STORAGE_KEY = "mono_diary_v20";
const FOLDER_KEY = "diary_folder_id";  // 记住文件夹ID，下次不用再选
let notes = [];
let activeId = null;
let pressTimer = null;
let lastBlobUrl = null;

// 初始化/获取文件夹句柄
async function getRootHandle() {
    if (rootHandle) return rootHandle;
    // 尝试从 localStorage 恢复
    const savedId = localStorage.getItem(FOLDER_KEY);
    if (savedId) {
        try {
            const handles = await window.showDirectoryPicker();
            // 简单判断：如果用户重新选了，就更新
            rootHandle = handles;
            localStorage.setItem(FOLDER_KEY, 'selected');
            return rootHandle;
        } catch (e) {
            // 权限失效，重新选
        }
    }
    // 弹窗让用户选一个文件夹
    try {
        rootHandle = await window.showDirectoryPicker();
        localStorage.setItem(FOLDER_KEY, 'selected');
        return rootHandle;
    } catch (err) {
        showToast('需要选择一个文件夹来存放图片');
        throw err;
    }
}

// 保存图片到文件夹，返回文件名
async function saveImageToFolder(file) {
    const dir = await getRootHandle();
    const timestamp = Date.now();
    const ext = file.name.split('.').pop() || 'jpg';
    const fileName = `img_${timestamp}_${Math.random().toString(36).substring(2, 6)}.${ext}`;
    const fileHandle = await dir.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(file);
    await writable.close();
    return fileName;
}

// 从文件夹读取图片，生成 Blob URL
async function loadImageFromFolder(fileName) {
    try {
        const dir = await getRootHandle();
        const fileHandle = await dir.getFileHandle(fileName);
        const file = await fileHandle.getFile();
        return URL.createObjectURL(file);
    } catch (err) {
        console.warn('图片加载失败', fileName);
        return null;
    }
}

// 删除图片文件
async function deleteImageFromFolder(fileName) {
    try {
        const dir = await getRootHandle();
        await dir.removeEntry(fileName);
    } catch (err) {
        console.warn('删除图片失败', fileName);
    }
}

// ---------- 笔记数据管理 ----------
function getTodayStr() {
    let d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function genId() { return Date.now() + '-' + Math.random().toString(36).substring(2, 8); }

async function saveToLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    await refreshUI();
}

function getBodyHTML() {
    let container = document.getElementById('noteBody');
    let clone = container.cloneNode(true);
    clone.querySelectorAll('img[data-img-name]').forEach(img => {
        let imgName = img.getAttribute('data-img-name');
        if (imgName) {
            let placeholder = document.createElement('span');
            placeholder.setAttribute('data-img-placeholder', imgName);
            placeholder.style.display = 'inline-block';
            placeholder.textContent = '📷';
            placeholder.style.fontSize = '0.8rem';
            placeholder.style.opacity = '0.5';
            img.replaceWith(placeholder);
        }
    });
    return clone.innerHTML;
}

async function setBodyHTMLFromStorage(html) {
    let container = document.getElementById('noteBody');
    container.innerHTML = html || '';
    let placeholders = container.querySelectorAll('[data-img-placeholder]');
    for (let ph of placeholders) {
        let imgName = ph.getAttribute('data-img-placeholder');
        if (imgName) {
            let imgUrl = await loadImageFromFolder(imgName);
            if (imgUrl) {
                let img = document.createElement('img');
                img.src = imgUrl;
                img.setAttribute('data-img-name', imgName);
                img.style.maxWidth = '100%';
                img.style.maxHeight = '120px';
                img.style.borderRadius = '12px';
                img.style.margin = '6px 0';
                img.style.display = 'block';
                ph.replaceWith(img);
            } else {
                let span = document.createElement('span');
                span.textContent = '[图片缺失]';
                span.style.color = '#999';
                ph.replaceWith(span);
            }
        }
    }
    attachImageDoubleClick();
}

function attachImageDoubleClick() {
    let images = document.querySelectorAll('#noteBody img[data-img-name]');
    images.forEach(img => {
        img.removeEventListener('dblclick', img._doubleClickHandler);
        img.removeEventListener('touchend', img._touchEndHandler);
        let clickTimer = null;
        let imgName = img.getAttribute('data-img-name');
        let doubleClickHandler = async () => {
            if (confirm('删除这张图片？')) {
                if (imgName) await deleteImageFromFolder(imgName);
                img.remove();
                showToast('图片已删除');
            }
        };
        let touchEndHandler = (e) => {
            if (clickTimer) {
                clearTimeout(clickTimer);
                clickTimer = null;
                doubleClickHandler();
                e.preventDefault();
            } else {
                clickTimer = setTimeout(() => { clickTimer = null; }, 200);
            }
        };
        img._doubleClickHandler = doubleClickHandler;
        img._touchEndHandler = touchEndHandler;
        img.addEventListener('dblclick', doubleClickHandler);
        img.addEventListener('touchend', touchEndHandler);
    });
}

async function refreshUI() {
    document.getElementById('totalCount').innerText = notes.length + '篇';
    renderRecent();
    let targetNote = activeId ? notes.find(n => n.id === activeId) : null;
    if (targetNote) {
        document.getElementById('noteTitle').value = targetNote.title || '';
        await setBodyHTMLFromStorage(targetNote.content || '');
    } else if (notes.length > 0) {
        activeId = notes[0].id;
        let first = notes[0];
        document.getElementById('noteTitle').value = first.title || '';
        await setBodyHTMLFromStorage(first.content || '');
    } else {
        activeId = null;
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteBody').innerHTML = '';
    }
}

function addNewNote() {
    let newId = genId();
    let newNote = {
        id: newId,
        title: '新笔记',
        content: '',
        updatedAt: Date.now(),
        dateStr: getTodayStr()
    };
    notes.unshift(newNote);
    activeId = newId;
    saveToLocal();
    showToast('新建笔记');
}

async function deleteNoteById(id) {
    if (!id) return;
    if (confirm('删除这篇日记？')) {
        let idx = notes.findIndex(n => n.id === id);
        if (idx !== -1) {
            let note = notes[idx];
            if (note.content) {
                let imgNames = [...note.content.matchAll(/data-img-placeholder="([^"]+)"/g)].map(m => m[1]);
                for (let name of imgNames) {
                    await deleteImageFromFolder(name);
                }
            }
            notes.splice(idx, 1);
            if (notes.length === 0) activeId = null;
            else if (activeId === id) activeId = notes[0].id;
            await saveToLocal();
            showToast('已删除');
        }
    }
}

async function saveCurrent() {
    if (!activeId && notes.length === 0) {
        let newId = genId();
        let newNote = {
            id: newId,
            title: document.getElementById('noteTitle').value.trim() || '启程',
            content: getBodyHTML(),
            updatedAt: Date.now(),
            dateStr: getTodayStr()
        };
        notes = [newNote];
        activeId = newId;
        await saveToLocal();
        showToast('已保存');
        return;
    }
    if (!activeId && notes.length > 0) activeId = notes[0].id;
    let titleVal = document.getElementById('noteTitle').value;
    let contentVal = getBodyHTML();
    let idx = notes.findIndex(n => n.id === activeId);
    if (idx !== -1) {
        notes[idx].title = titleVal === '' ? '启程' : titleVal;
        notes[idx].content = contentVal;
        notes[idx].updatedAt = Date.now();
        notes[idx].dateStr = getTodayStr();
        await saveToLocal();
        showToast('已保存');
    } else if (notes.length) {
        activeId = notes[0].id;
        await saveCurrent();
    } else {
        addNewNote();
        await saveCurrent();
    }
}

async function insertImage() {
    let input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;
    input.onchange = async (e) => {
        let files = Array.from(e.target.files);
        for (let file of files) {
            let imgName = await saveImageToFolder(file);
            let imgUrl = await loadImageFromFolder(imgName);
            if (imgUrl) {
                let img = document.createElement('img');
                img.src = imgUrl;
                img.setAttribute('data-img-name', imgName);
                img.style.maxWidth = '100%';
                img.style.maxHeight = '120px';
                img.style.borderRadius = '12px';
                img.style.margin = '6px 0';
                img.style.display = 'block';
                document.getElementById('noteBody').appendChild(img);
                attachImageDoubleClick();
                showToast('已添加图片');
            }
        }
    };
    input.click();
}

function exportData() {
    if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
    let dataStr = JSON.stringify(notes, null, 2);
    let blob = new Blob([dataStr], { type: 'application/json' });
    let url = URL.createObjectURL(blob);
    lastBlobUrl = url;
    let a = document.createElement('a');
    a.href = url;
    a.download = `心迹日记_备份_${getTodayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
        document.body.removeChild(a);
        if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = null;
    }, 500);
    showToast('导出成功');
}

function importData() {
    let input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = (e) => {
        let file = e.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = async (ev) => {
            try {
                let imported = JSON.parse(ev.target.result);
                if (Array.isArray(imported)) {
                    notes = imported;
                    if (notes.length > 0) activeId = notes[0].id;
                    else activeId = null;
                    await saveToLocal();
                    showToast('导入成功');
                } else showToast('文件格式错误');
            } catch (err) { showToast('解析失败'); }
        };
        reader.readAsText(file);
    };
    input.click();
}

function renderRecent() {
    let container = document.getElementById('recentList');
    if (!container) return;
    if (notes.length === 0) {
        container.innerHTML = '<div class="empty-history">暂无日记 · 点击上方新建</div>';
        return;
    }
    let sorted = [...notes];
    sorted.sort((a, b) => b.updatedAt - a.updatedAt);
    let limit = Math.min(12, sorted.length);
    let itemsHtml = '';
    for (let i = 0; i < limit; i++) {
        let note = sorted[i];
        let dateShow = note.dateStr || '最近';
        let titleRaw = note.title ? note.title : '无标题';
        let previewRaw = (note.content || '').replace(/<[^>]*>/g, ' ').replace(/\n/g, ' ').substring(0, 38);
        if (previewRaw === '') previewRaw = '无内容';
        itemsHtml += `<div class="history-item" data-id="${note.id}">
            <div class="item-info">
                <div class="item-date">${escapeHtml(dateShow)}</div>
                <div class="item-preview">${escapeHtml(titleRaw)} · ${escapeHtml(previewRaw)}</div>
            </div>
        </div>`;
    }
    container.innerHTML = itemsHtml;
    document.querySelectorAll('.history-item').forEach(el => {
        let id = el.getAttribute('data-id');
        if (!id) return;
        el.addEventListener('click', (e) => {
            if (pressTimer) clearTimeout(pressTimer);
            if (id) { activeId = id; refreshUI(); showToast('切换'); }
        });
        el.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => { if (id) deleteNoteById(id); pressTimer = null; }, 500);
        });
        el.addEventListener('touchend', () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
        el.addEventListener('touchmove', () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
        el.addEventListener('mousedown', (e) => {
            pressTimer = setTimeout(() => { if (id) deleteNoteById(id); pressTimer = null; }, 500);
        });
        el.addEventListener('mouseup', () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
        el.addEventListener('mouseleave', () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
    });
}

function showToast(msg) {
    let toast = document.getElementById('globalToast');
    if (!toast) return;
    toast.innerText = msg;
    toast.style.opacity = '1';
    if (window.timerToast) clearTimeout(window.timerToast);
    window.timerToast = setTimeout(() => { toast.style.opacity = '0'; }, 1300);
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, (m) => { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; });
}

async function loadInitial() {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
        try { let arr = JSON.parse(raw); if (Array.isArray(arr)) notes = arr; else notes = []; } catch (e) { notes = []; }
    }
    if (notes.length === 0) {
        let initId = genId();
        notes = [{ id: initId, title: '启程', content: '写下第一篇日记。', updatedAt: Date.now(), dateStr: getTodayStr() }];
        activeId = initId;
    } else {
        activeId = notes[0].id;
    }
    await saveToLocal();
}

function bindEvents() {
    document.getElementById('saveNote')?.addEventListener('click', () => saveCurrent());
    document.getElementById('newNoteBtn')?.addEventListener('click', () => addNewNote());
    document.getElementById('insertImageBtn')?.addEventListener('click', () => insertImage());
    document.getElementById('exportBtn')?.addEventListener('click', () => exportData());
    document.getElementById('importBtn')?.addEventListener('click', () => importData());
    window.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveCurrent(); } });
}

(async function() {
    await loadInitial();
    bindEvents();
    await refreshUI();
})();
})();
</script>
</body>
</html>
